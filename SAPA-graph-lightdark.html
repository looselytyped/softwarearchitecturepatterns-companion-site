const col = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const KIND_COLOR = {}, REL_COLOR = {}, THEME = {};
function readTheme(){ Object.assign(KIND_COLOR, {"note:pattern":col('--note'),"note:antipattern":col('--anti'),"note:pitfall":col('--pit'),"note:unresolved":col('--unres'),
  "tag:context":col('--ctx'),"tag:capability":col('--cap'),"tag:author":col('--auth'),"tag:influence":col('--infl'),"tag:aka":col('--aka')});
  Object.assign(REL_COLOR, {link:col('--link'),context:col('--ctx'),improved:col('--imp'),degraded:col('--deg'),author:col('--auth'),influence:col('--infl'),aka:col('--aka')});

const themeToggle = document.getElementById('theme-toggle');

function updateThemeToggle(){
  const light = isLightTheme();

  themeToggle.setAttribute('aria-pressed', String(light));

}
themeToggle.addEventListener('click',()=>setTheme(isLightTheme() ? 'dark' : 'light'));
readTheme();
updateThemeToggle();
systemLight.addEventListener('change',()=>{ if(!document.documentElement.dataset.theme){ readTheme(); updateThemeToggle(); } });
const KIND_LABEL = {"note:pattern":"Pattern","note:antipattern":"Antipattern","note:pitfall":"Pitfall","note:unresolved":"Unresolved link","tag:context":"Context tag","tag:capability":"Capability tag","tag:author":"Author tag","tag:influence":"Influence tag","tag:aka":"Alias tag"};

const byId = new Map();
const W0 = innerWidth, H0 = innerHeight;
DATA.nodes.forEach((n,i)=>{ const a=i*2.399, r=Math.sqrt(i)*30; n.x=W0/2+Math.cos(a)*r; n.y=H0/2+Math.sin(a)*r; n.vx=n.vy=0; n.fixed=false; n.deg=0; byId.set(n.id,n); });
DATA.links.forEach(l=>{ l.source=byId.get(l.s); l.target=byId.get(l.t); l.source.deg++; l.target.deg++; });
DATA.nodes.forEach(n=>{ n.r = 2.5 + Math.sqrt(n.deg)*1.1; });

const enabled = {}; document.querySelectorAll('#panel input[data-k]').forEach(cb=>{ enabled[cb.dataset.k]=cb.checked; cb.onchange=()=>{ enabled[cb.dataset.k]=cb.checked; rebuild(); }; });
let nodes=[], links=[], adj=new Map();
function rebuild(){
  nodes = DATA.nodes.filter(n=>enabled[n.kind]);
  const set = new Set(nodes);
  links = DATA.links.filter(l=>set.has(l.source)&&set.has(l.target));
  adj = new Map(); nodes.forEach(n=>adj.set(n,new Set()));
  links.forEach(l=>{ adj.get(l.source).add(l.target); adj.get(l.target).add(l.source); });
  document.getElementById('stat').textContent = `${nodes.length} nodes · ${links.length} edges`;
  alpha = Math.max(alpha, .6);
}

// ---------- simulation ----------
let alpha = 1;
const P = { repel: 10, dist: 120, center: .12 };
function tick(){
  if (alpha < .003) return;
  const n = nodes.length; if(!n) return;
  const k = P.repel * 700;
  // Barnes-Hut is overkill for <150 nodes; O(n^2)
  for (let i=0;i<n;i++){ const a=nodes[i];
    for (let j=i+1;j<n;j++){ const b=nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy; if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1;}
      if (d2 > 1000000) continue;
      const f = k/d2, d=Math.sqrt(d2), fx=dx/d*f, fy=dy/d*f;
      a.vx-=fx*alpha; a.vy-=fy*alpha; b.vx+=fx*alpha; b.vy+=fy*alpha; } }
  for (const l of links){ const a=l.source,b=l.target;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const target = P.dist * (l.rel==='link'?1:.75);
    const f = (d-target)/d*.08 * alpha;
    const wa = b.deg/(a.deg+b.deg), wb = 1-wa;
    a.vx+=dx*f*wa; a.vy+=dy*f*wa; b.vx-=dx*f*wb; b.vy-=dy*f*wb; }

  for (const p of nodes){
    p.vx += (cx-p.x)*P.center*.01*alpha; p.vy += (cy-p.y)*P.center*.01*alpha;
    if (p.fixed || p===dragging){ p.vx=p.vy=0; continue; }
    p.vx*=.6; p.vy*=.6; p.x+=p.vx; p.y+=p.vy; }
  alpha *= .995;
}

// ---------- view / render ----------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let dpr=devicePixelRatio||1, tx=0, ty=0, scale=1;
function resize(){ dpr=devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
addEventListener('resize',resize); resize();
let hover=null, selected=null, dragging=null, query='';
const showArrows=document.getElementById('arrows'), showLabels=document.getElementById('labels');

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=col('--bg'); ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.translate(tx,ty); ctx.scale(scale,scale);
  const focus = hover||selected;
  const nb = focus ? adj.get(focus) : null;
  const q = query.toLowerCase();
  const matches = q ? new Set(nodes.filter(n=>n.label.toLowerCase().includes(q))) : null;
  // edges
  for (const l of links){
    const lit = focus ? (l.source===focus||l.target===focus) : true;
    ctx.globalAlpha = focus ? (lit? .95 : .06) : (matches? .12 : .55);
    ctx.strokeStyle = REL_COLOR[l.rel]||'#666';
    ctx.lineWidth = (l.rel==='link'?1.2:.9)/scale*(lit&&focus?1.6:1);
    ctx.beginPath(); ctx.moveTo(l.source.x,l.source.y); ctx.lineTo(l.target.x,l.target.y); ctx.stroke();
    if (showArrows.checked && (lit||!focus)){
      const dx=l.target.x-l.source.x, dy=l.target.y-l.source.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      const ex=l.target.x-ux*(l.target.r+2), ey=l.target.y-uy*(l.target.r+2), s=6/scale;
      ctx.fillStyle=ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-ux*s-uy*s*.5,ey-uy*s+ux*s*.5); ctx.lineTo(ex-ux*s+uy*s*.5,ey-uy*s-ux*s*.5); ctx.closePath(); ctx.fill();
    }
  }
  // nodes
  ctx.globalAlpha=1;
  for (const n of nodes){
    const lit = focus ? (n===focus||nb.has(n)) : (matches ? matches.has(n) : true);
    ctx.globalAlpha = lit ? 1 : .12;
    ctx.fillStyle = KIND_COLOR[n.kind];
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
    if (n===selected||n===hover){ ctx.strokeStyle=THEME.ring; ctx.lineWidth=2/scale; ctx.stroke(); }
    if (n.fixed){ ctx.strokeStyle=THEME.ringSoft; ctx.lineWidth=1/scale; ctx.beginPath(); ctx.arc(n.x,n.y,n.r+3/scale,0,Math.PI*2); ctx.stroke(); }
  }

  const labelAll = showLabels.checked && scale > .75;
  ctx.textAlign='center'; ctx.textBaseline='top';
  for (const n of nodes){
    const lit = focus ? (n===focus||nb.has(n)) : (matches ? matches.has(n) : true);
    if (!(labelAll || n===hover || n===selected || (focus&&lit) || (matches&&lit))) continue;
    const fs = Math.max(10/scale, 11);
    ctx.font = `${n===focus?'600 ':''}${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.globalAlpha = lit ? (labelAll? .85:1) : .1;

function loop(){ tick(); draw(); requestAnimationFrame(loop); }

const toWorld = (px,py)=>[(px-tx)/scale,(py-ty)/scale];
function pick(px,py){ const [x,y]=toWorld(px,py); let best=null,bd=Infinity;
  for (const n of nodes){ const d=Math.hypot(n.x-x,n.y-y); if(d<Math.max(n.r,6/scale)+3/scale && d<bd){best=n;bd=d;} } return best; }
let panning=false, px0=0, py0=0, moved=false;
cv.addEventListener('mousedown',e=>{ const n=pick(e.clientX,e.clientY); moved=false; px0=e.clientX; py0=e.clientY;
  if(n){ dragging=n; alpha=Math.max(alpha,.3);} else { panning=true; cv.classList.add('drag'); } });
addEventListener('mousemove',e=>{
  if (dragging){ const [x,y]=toWorld(e.clientX,e.clientY); dragging.x=x; dragging.y=y; alpha=Math.max(alpha,.3); moved=true; return; }
  if (panning){ tx+=e.clientX-px0; ty+=e.clientY-py0; px0=e.clientX; py0=e.clientY; moved=true; return; }

addEventListener('mouseup',e=>{
  if (dragging){ if(moved) dragging.fixed=true; else select(dragging); dragging=null; }
  panning=false; cv.classList.remove('drag'); });
cv.addEventListener('dblclick',e=>{ const n=pick(e.clientX,e.clientY); if(n){ n.fixed=false; alpha=Math.max(alpha,.3);} });

// touch: basic pan/drag
let lastTouch=null;
cv.addEventListener('touchstart',e=>{ const t=e.touches[0]; lastTouch=[t.clientX,t.clientY]; const n=pick(t.clientX,t.clientY); if(n) dragging=n; else panning=true; },{passive:true});
cv.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(dragging){ const [x,y]=toWorld(t.clientX,t.clientY); dragging.x=x;dragging.y=y; alpha=Math.max(alpha,.3);} else if(panning&&lastTouch){ tx+=t.clientX-lastTouch[0]; ty+=t.clientY-lastTouch[1]; } lastTouch=[t.clientX,t.clientY]; e.preventDefault(); },{passive:false});
cv.addEventListener('touchend',()=>{ if(dragging){ select(dragging); dragging=null;} panning=false; });

const info=document.getElementById('info'), infoBody=document.getElementById('infoBody');
document.getElementById('close').onclick=()=>{ selected=null; info.style.display='none'; };
function select(n){ selected=n; if(!n){ info.style.display='none'; return; }
  const out = DATA.links.filter(l=>l.source===n), inn = DATA.links.filter(l=>l.target===n);
  const group=(arr,rel,title,cls='')=>{ const xs=arr.filter(l=>l.rel===rel); if(!xs.length) return '';
    return `<h2>${title} (${xs.length})</h2><ul>${xs.map(l=>`<li class="${cls}" data-id="${esc(l.target===n?l.source.id:l.target.id)}">${esc(l.target===n?l.source.label:l.target.label)}</li>`).join('')}</ul>`; };
  let h = `<h1>${esc(n.label)}</h1><div class="kind">${KIND_LABEL[n.kind]} · ${n.deg} connections</div>`;
  if (n.kind.startsWith('note')){
    h += group(out,'author','Author') + group(out,'context','Contexts') + group(out,'improved','Improves','imp') + group(out,'degraded','Degrades','deg')
       + group(out,'influence','Influences') + group(out,'aka','Also known as') + group(out,'link','Links to') + group(inn,'link','Linked from');
  } else {
    h += group(inn,'improved','Improved by','imp') + group(inn,'degraded','Degraded by','deg')
       + group(inn,'context','Used in') + group(inn,'influence','Influences') + group(inn,'aka','Alias of');
  }
  infoBody.innerHTML=h; info.style.display='block';
  infoBody.querySelectorAll('li').forEach(li=>li.onclick=()=>{ const t=byId.get(li.dataset.id); if(t){ if(!enabled[t.kind]){ const cb=document.querySelector(`[data-k="${t.kind}"]`); cb.checked=true; enabled[t.kind]=true; rebuild(); } select(t); centerOn(t);} });
}
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function centerOn(n){ tx=innerWidth/2-n.x*scale; ty=(innerHeight+64)/2-n.y*scale; }
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim(); });
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const q=query.toLowerCase(); const n=nodes.find(x=>x.label.toLowerCase().includes(q)); if(n){ select(n); centerOn(n);} } });
document.getElementById('repel').oninput=e=>{ P.repel=+e.target.value; alpha=Math.max(alpha,.5); };
document.getElementById('dist').oninput=e=>{ P.dist=+e.target.value; alpha=Math.max(alpha,.5); };
document.getElementById('center').oninput=e=>{ P.center=e.target.value/100; alpha=Math.max(alpha,.5); };
document.getElementById('reheat').onclick=()=>{ nodes.forEach(n=>n.fixed=false); alpha=1; };
function fit(){ if(!nodes.length) return; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);});
  const pad=80, w=x1-x0+pad*2, h=y1-y0+pad*2; scale=Math.min(innerWidth/w, (innerHeight-64)/h, 2);
  tx=innerWidth/2-(x0+x1)/2*scale; ty=(innerHeight+64)/2-(y0+y1)/2*scale; }
document.getElementById('fit').onclick=fit;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ selected=null; info.style.display='none'; } });

rebuild();
// pre-settle so the first frame is not a blob
for (let i=0;i<700;i++) tick();
fit(); alpha=.4;
loop();
</script>
</body>
</html>
